# InfinityOS Calamares installer settings
# Controls the UI page sequence and the exec (installation) sequence.
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

sequence:
  # ── Pages shown in the sidebar (user-facing steps) ────────────────────────
  - show:
    - welcome        # Requirements check + welcome text
    - locale         # Timezone and language
    - keyboard       # Keyboard layout
    - partition      # Disk partitioning
    - users          # Create user account + hostname
    - summary        # Review before committing

  # ── Exec steps (run silently while slideshow plays) ───────────────────────
  - exec:
    - partition      # Format and mount target partitions
    - mount          # Mount target filesystem
    - unpackfs       # Copy squashfs → target disk (the big one)
    - machineid      # Generate /etc/machine-id
    - fstab          # Write /etc/fstab
    - locale         # Write locale config
    - keyboard       # Write keyboard config
    - localecfg      # Generate locale (locale-gen)
    - users          # Create the real user account
    - displaymanager # Configure SDDM for the real user (no autologin)
    - networkcfg     # Write hostname and /etc/hosts
    - hwclock        # Set hardware clock to UTC
    - services-systemd  # Enable/disable systemd services
    - grubcfg        # Write /etc/default/grub
    - bootloader     # Run grub-install + grub-mkconfig
    - packages       # Remove live-only packages (calamares, live-boot, etc.)
    - plymouthcfg    # Set Plymouth theme in installed system
    - initramfs      # Rebuild initramfs (embeds Plymouth + correct modules)
    - removeuser     # Delete the live "user" account
    - umount         # Unmount target filesystem

  # ── Final screen ──────────────────────────────────────────────────────────
  - show:
    - finished       # "Restart now" button

# ── Global settings ───────────────────────────────────────────────────────────
branding: infinityos

# Confirm before starting the exec phase (shows "Install now?" dialog)
prompt-install: true

# Always run in chroot mode (normal for a live ISO installer)
dont-chroot: false

# Not an OEM pre-install scenario
oem-setup: false

# User can cancel during the page phase but not during exec
disable-cancel: false
disable-cancel-during-exec: true

# Hide nav buttons while exec is running (cleaner UX)
hide-back-and-next-during-exec: true

# Don't auto-quit after install — show the finished page
quit-at-end: false
