# Calamares displaymanager module — InfinityOS
---
# The display manager already installed via package list
displaymanager: sddm

# The desktop session to use
defaultDesktopEnvironment:
    executable: "startplasma-x11"
    desktopFile: "plasma"

# Configure autologin for the installed user?
# No — that's only for the live session. Installed system requires login.
autologinUser: ""

# SDDM config file location
sddmConfFile: /etc/sddm.conf

# SDDM theme — Breeze dark (matches InfinityOS style)
# A hook already sets this, but Calamares will write it too
basicSetup: false
