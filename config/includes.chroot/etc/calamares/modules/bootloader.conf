# Calamares bootloader module — InfinityOS
---
# Install GRUB on EFI systems using grub-efi-amd64,
# on BIOS/legacy systems using grub-pc.
# Calamares detects which automatically.

efiBootLoader:  "grub"
grubInstall:    "grub-install"
grubMkconfig:   "grub-mkconfig"
grubCfg:        "/boot/grub/grub.cfg"
grubProbe:      "grub-probe"
efiBootMgr:     "efibootmgr"

# Where to mount the EFI partition during install
efiSystemPartition: "/boot/efi"

# EFI directory inside the ESP
efiDirectory: "/boot/efi"

# Use the distributor name from /etc/os-release
# (which our hook already sets to "InfinityOS")
grubDistributor: ""

# GRUB timeout (seconds) — fast: user just installed, they know what they have
timeout: 3

# Write GRUB config to installed system
installEFIFallback: true
