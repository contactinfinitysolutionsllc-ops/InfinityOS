# Calamares users module — InfinityOS
---
# The default group for new users
defaultGroups:
    - name: users
      state: create
    - name: sudo
      state: create
    - name: audio
      state: create
    - name: video
      state: create
    - name: plugdev
      state: create
    - name: netdev
      state: create
    - name: bluetooth
      state: create
    - name: input
      state: create

# After install, add the new user to all of these
userGroups:
    - audio
    - video
    - plugdev
    - netdev
    - bluetooth
    - sudo
    - input
    - cdrom
    - floppy
    - tape
    - dialout

# The shell for the new user
userShell: /bin/bash

# sudoers rule written for the user
# Full sudo with password (more secure than the live user's NOPASSWD)
sudoersGroup: sudo

# Hostname configuration
setRootPassword:          false   # Root account stays locked (sudo only)
doAutoLogin:              false   # User must log in — not a live session
passwordRequirements:
    minLength:            6
    maxLength:            -1      # No upper limit
    libpwquality:
        - minlen=6
        - minclass=1            # At least 1 character class

# Avatar: KDE will handle it after first login
avatarFilePath: ""

# These are shown as placeholder hints in the UI
fullName:        ""
loginName:       ""
hostname:        "infinityos"     # Default hostname — user can change
