# Calamares keyboard module — InfinityOS
---
# Default keyboard layout — user can override on this screen
defaultLayout:  "us"
defaultVariant: ""

# Write keyboard config to these locations in the installed system
xorgConfFile:   "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
