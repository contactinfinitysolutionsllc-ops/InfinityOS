# Calamares services-systemd module — InfinityOS
# Enable/disable systemd services in the installed system.
---
services:
    # Core networking
    - name: NetworkManager
      mandatory: true

    # Firewall — must be on by default
    - name: ufw
      mandatory: true

    # Encrypted DNS (DNS-over-TLS via stubby)
    - name: stubby
      mandatory: true

    # Display manager
    - name: sddm
      mandatory: true

    # AppArmor security
    - name: apparmor
      mandatory: false

    # Bluetooth (optional — not all machines have it)
    - name: bluetooth
      mandatory: false

    # Local AI assistant (will wait for model download on first boot)
    - name: infinity-ai
      mandatory: false

    # First-boot model downloader
    - name: infinity-first-boot
      mandatory: false

    # Avahi (mDNS/zeroconf) — useful for LAN discovery
    - name: avahi-daemon
      mandatory: false

    # CUPS printing
    - name: cups
      mandatory: false

# Services to DISABLE in the installed system
# (these only make sense in the live session)
disable:
    - live-config
    - live-boot
