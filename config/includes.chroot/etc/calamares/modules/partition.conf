# Calamares partition module — InfinityOS
---
# The filesystem to use when the user picks "Erase disk"
defaultFileSystemType: "ext4"

# Offer these filesystem options in the manual partitioning UI
availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs
    - fat32
    - linuxswap

# Swap handling:
# "suspend" = swap partition sized for RAM (enables hibernate)
# "small"   = 512MB swap regardless of RAM
# "none"    = no swap (user can add later)
userSwapChoices:
    - none
    - small
    - suspend
    - file

# Minimum partition sizes (in MiB)
# efiSystemPartition size for UEFI installs
efiSystemPartition:        "/boot/efi"
efiSystemPartitionSize:    300
efiSystemPartitionName:    "EFI System Partition"

# When erasing or installing alongside, use GPT by default on EFI systems
# (MBR used on BIOS/legacy systems automatically)

# Show the "Encrypt system" checkbox on the erase-disk path
allowManualPartitioning:   true
showNotEncryptedBootMessage: true

# LUKS2 is the modern standard — use it when user picks encryption
luksFileSystemType: "ext4"
luksGenerateKeyfile: true

# Recommended partition layout hint shown to user
initialPartitioningChoice: erase
initialSwapChoice: suspend
