# Calamares grubcfg module — InfinityOS
# Writes /etc/default/grub in the installed system before grub-install runs.
---
# Keep quiet splash so Plymouth shows on first real boot
keep_distributor: false
use_pretty_name: true          # Pulls from /etc/os-release PRETTY_NAME

# Force these into the installed system's /etc/default/grub
# (Our includes.chroot already has this file, so Calamares just needs
# to not clobber it — setting keep_distributor=false + use_pretty_name=true
# will write "InfinityOS 1.0 (Debian Bookworm)" to GRUB_DISTRIBUTOR)
