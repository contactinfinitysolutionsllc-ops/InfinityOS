# Calamares finished module — InfinityOS
# The final screen shown after installation completes.
---
# Show a restart button
restartNowEnabled:   true
restartNowChecked:   true
restartNowCommand:   "shutdown -r now"

# Show option to close without restarting (for power users)
notifyOnFinished:    false

# Message shown on the finished screen (uses branding productName)
# The actual text is pulled from Calamares translation strings;
# these just control the behavior.
