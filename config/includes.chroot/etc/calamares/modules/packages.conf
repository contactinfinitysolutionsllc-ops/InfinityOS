# Calamares packages module — InfinityOS
# Runs apt operations in the installed system after unpackfs.
# Used to remove live-only packages that have no place on a real install.
---
backend: apt

# Don't re-download packages — they're already on the squashfs
update_db: false

# Packages to remove from the installed system (live-session only tools)
remove:
    - calamares
    - calamares-settings-debian
    - live-boot
    - live-boot-initramfs-tools
    - live-config
    - live-config-systemd
    - live-tools

# Nothing to install post-copy — everything is pre-baked in the squashfs
install: []
