# Calamares locale module — InfinityOS
---
# Default region/zone — user can change on this screen
region:   "America"
zone:     "New_York"

# Default locale written to /etc/locale.gen and /etc/default/locale
defaultLocale: "en_US.UTF-8"

# Whether to also set the GeoIP-detected locale
geoipUrl: "https://geoip.kde.org/v1/calamares"

# These control what the locale page asks about
configurationsSet:
    - lcAll: false           # Don't set LC_ALL (let locale handle it)
    - lcAddress: false
    - lcCollate: false
    - lcCtype: false
    - lcIdentification: false
    - lcMeasurement: false
    - lcMessages: false
    - lcMonetary: false
    - lcName: false
    - lcNumeric: false
    - lcPaper: false
    - lcTelephone: false
    - lcTime: false
