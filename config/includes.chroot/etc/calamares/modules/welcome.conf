# Calamares welcome module — InfinityOS
---
# Show "What's new" / requirements check on the welcome page
showSupportUrl:        true
showKnownIssuesUrl:    true
showReleaseNotesUrl:   false
showDonateUrl:         false

# These are checked before the user can proceed past the welcome screen.
# All must pass or the "Next" button is grayed out.
requirements:
    requiredStorage:    15.0     # GB — InfinityOS base + gaming stack needs room
    requiredRam:        2.0      # GB minimum
    internetCheckUrl:   "https://github.com"
    check:
        - storage
        - ram
        - power
        - internet
    required:
        - storage
        - ram
