# .github/workflows/build-iso.yml
#
# Builds the InfinityOS ISO and publishes it as a GitHub Release
# whenever a version tag is pushed:
#   git tag v1.0.0 && git push --tags
#
# The ISO is built using Debian's live-build tool on an Ubuntu runner.
# Full build takes ~40-60 minutes.

name: Build ISO

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:   # allow manual trigger for testing

jobs:
  build:
    name: Build InfinityOS ISO
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build + tools
        run: |
          sudo apt-get update
          # Install build tools from Ubuntu repos
          sudo apt-get install -y \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            isolinux \
            syslinux-common \
            wget \
            ca-certificates
          # Install live-build AND debian-archive-keyring from Debian Bookworm.
          # Ubuntu's copies of both are too old:
          #   - live-build: missing options we need
          #   - debian-archive-keyring: missing Bookworm signing key F8D2585B8783D481
          # Dynamically resolve URLs so this doesn't break when Debian updates versions.
          PACKAGES_ALL="https://deb.debian.org/debian/dists/bookworm/main/binary-all/Packages.gz"

          # debian-archive-keyring (architecture: all)
          KEYRING_PATH=$(wget -qO- "$PACKAGES_ALL" | zcat | \
            awk '/^Package: debian-archive-keyring/{p=1} p && /^Filename:/{print $2; p=0}' | head -1)
          echo "Installing debian-archive-keyring from: $KEYRING_PATH"
          wget -qO /tmp/debian-archive-keyring.deb "https://deb.debian.org/debian/$KEYRING_PATH"
          sudo dpkg -i /tmp/debian-archive-keyring.deb

          # live-build (architecture: all)
          LB_PATH=$(wget -qO- "$PACKAGES_ALL" | zcat | \
            awk '/^Package: live-build/{p=1} p && /^Filename:/{print $2; p=0}' | head -1)
          echo "Installing live-build from: $LB_PATH"
          wget -qO /tmp/live-build.deb "https://deb.debian.org/debian/$LB_PATH"
          sudo dpkg -i /tmp/live-build.deb || sudo apt-get install -f -y
          lb --version

      - name: Make auto scripts executable
        run: chmod +x auto/config auto/build auto/clean

      - name: Configure live-build
        # lb config does NOT need root — run as the regular user so that
        # live-build's auto-generated hooks land with runner ownership,
        # making the subsequent chmod step work without sudo.
        run: ./auto/config

      - name: Make hooks executable
        # sudo needed for any live-build generated hooks (owned by root if
        # config was run as root — kept as safety net either way).
        run: sudo chmod +x config/hooks/normal/*.hook.chroot

      - name: Build ISO
        # pipefail ensures lb's exit code propagates through tee
        run: |
          set -o pipefail
          sudo lb build 2>&1 | tee build.log
        timeout-minutes: 120

      - name: Rename ISO with version
        run: |
          # Use tag name for tagged releases, branch+SHA for manual dispatches
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.ref_name }}-$(git rev-parse --short HEAD)"
          fi
          mv live-image-amd64.hybrid.iso "InfinityOS-${VERSION}-amd64.iso" 2>/dev/null || \
          mv *.iso "InfinityOS-${VERSION}-amd64.iso"
          sha256sum "InfinityOS-${VERSION}-amd64.iso" > "InfinityOS-${VERSION}-amd64.iso.sha256"
          echo "ISO_FILE=InfinityOS-${VERSION}-amd64.iso" >> $GITHUB_ENV
          echo "ISO_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Publish GitHub Release
        # Only publish a real release on version tags — not on manual dispatch from a branch
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "InfinityOS ${{ github.ref_name }}"
          body: |
            ## InfinityOS ${{ github.ref_name }}

            **Privacy-first Debian-based Linux with gaming compatibility and local AI built in.**

            ### What's included
            - Debian Bookworm (Stable) base
            - KDE Plasma 5 desktop (dark purple theme, floating dock)
            - Wine-Staging + Proton-GE (Windows game/app compatibility out of the box)
            - Steam + Heroic Games Launcher pre-installed
            - Infinity Assistant — local AI (Phi-3.5-mini, downloads on first boot ~2.2 GB)
            - Firewall on by default, encrypted DNS, MAC address randomization
            - Telemetry blocked at OS level, Firefox hardened with uBlock Origin
            - Calamares graphical installer

            ### Installation
            1. Flash the ISO to a USB drive (`dd` or Balena Etcher)
            2. Boot from USB — live session starts automatically
            3. Click **Install InfinityOS** in the dock
            4. AI model downloads automatically on first boot (~2.2 GB, one time)

            ### Verify download
            ```
            sha256sum -c InfinityOS-${{ github.ref_name }}-amd64.iso.sha256
            ```
          files: |
            ${{ env.ISO_FILE }}
            ${{ env.ISO_FILE }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ISO as artifact (manual dispatch builds)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: InfinityOS-test-build
          path: |
            ${{ env.ISO_FILE }}
            ${{ env.ISO_FILE }}.sha256
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
